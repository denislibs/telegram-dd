name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Script quality gates (docs/quality-gates.md, "Script gates"): `pnpm check` runs oxlint, prettier, tsc, the diff /
  # tt-tests / license gates, the build and the bundle budgets; then the unit tests.
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # gates:diff, gates:tests and gates:upstream compare with telegram-tt at the baseline recorded in NOTICE.md.
      - name: Clone the telegram-tt reference at the base commit
        run: pnpm gates:reference
      - name: Check (lint, format, types, gates, build, bundle budgets)
        run: pnpm check
      - name: Test
        run: pnpm test
      # A report, never a blocker: which ported files changed in upstream telegram-tt since the base commit.
      - name: Upstream drift (report)
        continue-on-error: true
        run: pnpm gates:upstream --remote

  # Browser gates against our app: strict e2e (console / page errors / failed requests / stricterdom), a11y (axe).
  # See docs/quality-gates.md.
  browser:
    name: browser gates (e2e, a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-browser-gates
          path: |
            test-results/
            playwright-report*/
          retention-days: 7

  # Perf gates (leaks + long tasks under 4x CPU throttling on a production build), in a job of their own: the tests run
  # serially and a leak cycle takes up to ~4 min, so after e2e and a11y they ran into the 20 min limit.
  perf:
    name: perf gates (leaks, long tasks)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:perf
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-perf-gates
          path: |
            test-results/
            playwright-report*/
          retention-days: 7

  # Optional: needs the telegram-tt reference and `npm install` of its copy, so it never blocks a merge.
  visual-vs-tt:
    name: visual vs telegram-tt (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clone the telegram-tt reference at the base commit
        run: pnpm gates:reference
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diffs
          path: |
            tests/visual/__diff__/
            playwright-report-visual/
          retention-days: 7
